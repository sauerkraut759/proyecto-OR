[project]
name = "proyecto-optimizacion"
version = "0.1.0"
description = "Enrutamiento energéticamente eficiente en Redes de Sensores Inalámbricos (WSN) - Entrega Final ELI148"
readme = "README.md"
authors = [
  { name = "Terrapin", email = "freq.modulada@gmail.com" },
  { name = "El-Ronin", email = "mfernandezv@usm.cl" }
  { name = "Luis-Sarzuri", email = "lsarzuri@usm.cl" },
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "ortools>=9.15.6755",
]

[project.scripts]
proyecto-optimizacion = "wsn.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wsn"
